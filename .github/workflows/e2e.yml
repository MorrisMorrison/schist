# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      # Create test data directories
      - name: Prepare test data directories
        run: |
          mkdir -p test-data-auth-disabled test-data-auth-enabled
      
      # Start E2E services using CI docker-compose
      - name: Start E2E services
        run: |
          echo "Starting E2E services with local Docker build..."
          docker-compose -f docker-compose.e2e-ci.yml up --build -d
          
          echo "=== Network debugging ==="
          echo "Checking ci-network exists:"
          docker network ls | grep ci-network || echo "❌ ci-network not found"
          
          echo "Container network connections:"
          docker-compose -f docker-compose.e2e-ci.yml ps -q | xargs -I {} docker inspect {} --format '{{.Name}}: {{range $net, $conf := .NetworkSettings.Networks}}{{$net}} {{end}}'
          
          echo "Waiting for services to be accessible..."
          # Wait for both services to be ready - up to 90 seconds
          for i in {1..30}; do
            auth_disabled_ready=false
            auth_enabled_ready=false
            
            if curl -f -s http://localhost:8081/api/health > /dev/null 2>&1; then
              auth_disabled_ready=true
            fi
            
            if curl -f -s http://localhost:8082/api/health > /dev/null 2>&1; then
              auth_enabled_ready=true
            fi
            
            if [ "$auth_disabled_ready" = true ] && [ "$auth_enabled_ready" = true ]; then
              echo "✅ Both services are ready!"
              break
            fi
            
            echo "Attempt $i/30: Waiting for services (disabled: $auth_disabled_ready, enabled: $auth_enabled_ready)..."
            
            # Additional debugging on failed attempts
            if [ $i -eq 10 ]; then
              echo "=== Debugging after 10 attempts ==="
              echo "Port bindings:"
              docker port $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) 2>/dev/null || echo "No port info for auth-disabled"
              docker port $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) 2>/dev/null || echo "No port info for auth-enabled"
              echo "Container IPs:"
              docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' 2>/dev/null || echo "No IP for auth-disabled"
              docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' 2>/dev/null || echo "No IP for auth-enabled"
              echo "Container status details:"
              docker-compose -f docker-compose.e2e-ci.yml ps
              echo "Container logs (auth-disabled):"
              docker-compose -f docker-compose.e2e-ci.yml logs --tail=20 schist-e2e-auth-disabled
              echo "Container logs (auth-enabled):"
              docker-compose -f docker-compose.e2e-ci.yml logs --tail=20 schist-e2e-auth-enabled
              echo "Testing direct container IP connectivity:"
              DISABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
              ENABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
              if [ -n "$DISABLED_IP" ]; then
                echo "Testing auth-disabled at $DISABLED_IP:8080"
                curl -f -s "http://$DISABLED_IP:8080/api/health" && echo "✅ Direct IP works for auth-disabled" || echo "❌ Direct IP failed for auth-disabled"
              fi
              if [ -n "$ENABLED_IP" ]; then
                echo "Testing auth-enabled at $ENABLED_IP:8080"
                curl -f -s "http://$ENABLED_IP:8080/api/health" && echo "✅ Direct IP works for auth-enabled" || echo "❌ Direct IP failed for auth-enabled"
              fi
            fi
            
            sleep 3
          done
          
          # Final verification
          echo "Final connectivity verification:"
          curl -f -s http://localhost:8081/api/health > /dev/null && echo "✅ Auth-disabled service: OK" || echo "❌ Auth-disabled service: FAILED"
          curl -f -s http://localhost:8082/api/health > /dev/null && echo "✅ Auth-enabled service: OK" || echo "❌ Auth-enabled service: FAILED"
          
          echo "Container status:"
          docker-compose -f docker-compose.e2e-ci.yml ps
      
      # Run Playwright tests
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          CI: true
      
      # Show service logs if tests fail
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Auth-disabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-disabled
          echo "=== Auth-enabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-enabled
      
      # Ensure Docker containers are cleaned up even if tests fail
      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "Cleaning up E2E containers and images..."
          docker-compose -f docker-compose.e2e-ci.yml down --rmi all --volumes --remove-orphans 2>/dev/null || true
          
          # Additional cleanup for any stray containers
          docker stop $(docker ps -q --filter "name=schist") 2>/dev/null || true
          docker rm $(docker ps -aq --filter "name=schist") 2>/dev/null || true
          
          # Clean up test data directories
          rm -rf test-data-auth-disabled test-data-auth-enabled || true
          
          echo "✅ Cleanup completed"
