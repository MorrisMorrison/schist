# GitHub Actions workflow for running unit and integration tests
name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      
      - name: Run backend tests
        run: make run-backend-test

  frontend-tests:
    name: Frontend Tests  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Unit tests run in Vitest browser mode (provider: playwright, chromium),
      # so the browser binary must be present on the runner.
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run frontend unit tests
        run: cd frontend && npm run test:unit
      
      - name: Run linting
        run: cd frontend && npm run lint
      
      - name: Run type checking
        run: cd frontend && npm run check
