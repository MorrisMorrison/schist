version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Go backend module
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  # Frontend (SvelteKit) npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dev:
        dependency-type: development
        update-types: ["minor", "patch"]
      frontend-prod:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # Hold eslint / @eslint/js / typescript MAJORS: they outpace
      # typescript-eslint@8's peer ranges and break `npm ci`. @eslint/js is
      # versioned in lockstep with eslint, so its major must be held too. Remove
      # once typescript-eslint ships support for the new major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript is pinned ~6.0 (SvelteKit 3 needs ^6; typescript-eslint@8
      # allows ">=4.8.4 <6.1.0"), so hold minors too until typescript-eslint
      # widens its range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Hold @lucide/svelte MAJOR: v1 removed all brand icons (e.g. the Github
      # icon used in the GitHub-integration settings), which breaks the build.
      # Lift once those icons are replaced.
      - dependency-name: "@lucide/svelte"
        update-types: ["version-update:semver-major"]

  # E2E (Playwright) npm dependencies
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Same as /frontend: eslint 10 / @eslint/js 10 / typescript 6 majors broke
      # e2e's npm ci against typescript-eslint@8. Lift when typescript-eslint
      # supports them.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Base images in the root Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
