version: '3.8'

services:
  schist:
    profiles: ["prod"]
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./wiki-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_FRONTEND_URL=http://localhost:8080
      - NODE_ENV=production
    restart: unless-stopped

  # Development services
  schist-backend-dev:
    profiles: ["dev"]
    build:
      context: .
      target: backend-builder
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./wiki-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_FRONTEND_URL=http://localhost:5173
    command: ["go", "run", "./cmd/schist"]
    depends_on:
      - schist-frontend-dev

  schist-frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      target: frontend-builder
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    command: ["npm", "run", "dev", "--", "--host"]
    working_dir: /app/frontend
    environment:
      - PUBLIC_API_URL=http://localhost:8080/api