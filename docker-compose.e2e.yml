services:
  schist:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    network_mode: host
    volumes:
      - ./e2e-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=3000
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:3000
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s