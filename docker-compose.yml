services:
  schist:
    profiles: ["prod"]
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    ports:
      - "8080:8080"
    volumes:
      - ./wiki-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8080
      - ENV=production
    restart: unless-stopped

  schist-e2e-auth-disabled:
    profiles: ["e2e"]
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    network_mode: host
    volumes:
      - ./test-data-auth-disabled:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8081
      - SCHIST_AUTH_ENABLED=false
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8081
      - ENV=production

  schist-e2e-auth-enabled:
    profiles: ["e2e"]
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    network_mode: host
    volumes:
      - ./test-data-auth-enabled:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8082
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8082
      - ENV=production

