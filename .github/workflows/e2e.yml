# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Go for backend
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install dependencies
      - name: Install dependencies
        run: make install
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      
      # Run E2E tests (Docker-based with Playwright)
      - name: Run Playwright tests
        run: |
          make e2e
        env:
          CI: true
      
      # Ensure Docker containers are cleaned up even if tests fail
      - name: Cleanup Docker containers
        if: always()
        run: |
          docker-compose --profile e2e down 2>/dev/null || true
          docker stop $(docker ps -q --filter "name=schist") 2>/dev/null || true
          docker rm $(docker ps -aq --filter "name=schist") 2>/dev/null || true
