name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit

      # Run gitleaks via its Docker image instead of gitleaks/gitleaks-action,
      # which the repo's Actions allow-list (actions/* and docker/* only) blocks.
      # This reuses the same script as `make secret-scan` locally.
      - name: Run gitleaks
        run: make secret-scan