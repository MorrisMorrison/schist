version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Go backend module
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  # Frontend (SvelteKit) npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dev:
        dependency-type: development
        update-types: ["minor", "patch"]
      frontend-prod:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # Hold eslint/typescript MAJORS: they outpace typescript-eslint@8's peer
      # ranges (eslint "^8.40 || 9", typescript ">=4.8.4 <6.0.0") and break
      # `npm ci`. Remove once typescript-eslint ships support for the new major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # E2E (Playwright) npm dependencies
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Same as /frontend: eslint 10 / typescript 6 majors broke e2e's npm ci
      # against typescript-eslint@8. Lift when typescript-eslint supports them.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Base images in the root Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
