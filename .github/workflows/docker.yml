# Build the Docker image, smoke-test it, and -- only on a push to main or a
# release tag -- publish the *tested* image to ghcr. The image is built ONCE: the
# exact image that passed the health check is the one that gets pushed, so a
# broken image can never reach :latest (which deployments may auto-pull). PRs run
# build + test as a gate without publishing.
#
#   push to main   -> :latest + :main-<sha>
#   tag v0.0.1     -> :0.0.1 + :v0.0.1-<sha>   (never moves :latest)
#   manual run     -> :<tag input> + :<branch>-<sha>, if a tag is given
name: Docker

on:
  push:
    branches: [ main ]   # publish :latest on every main commit
    tags: [ 'v*' ]       # a release tag (v0.0.1) publishes the pinned :0.0.1 image
    paths:               # ...but only when something in the image actually changed (path
                         # filters aren't evaluated for tag pushes, so tags always build)
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main ]   # build + smoke-test only (no publish) as a merge gate
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:  # plus manual triggering with an optional explicit tag
    inputs:
      tag:
        description: 'Extra Docker image tag (optional; never latest unless you type it)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/schist; lowercased before pushing

jobs:
  docker:
    name: Docker Build & Publish
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}   # repo variable, see docs/CI.md
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Layer cache shared with the e2e workflow (same image, same scope): an
      # unchanged frontend or backend stage, and the npm/go dependency layers,
      # come from the cache instead of being rebuilt. Only main writes it: PRs
      # can read main's cache but not each other's, and the export costs ~35 s.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: schist-test:${{ github.run_id }}
          # The release tag (v0.0.1 -> 0.0.1) on tags, dev-<sha> otherwise.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha,scope=schist-image
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=schist-image' || '' }}

      - name: Test Docker image
        run: |
          set -euo pipefail
          NET="ci-${GITHUB_RUN_ID}"
          APP="app-${GITHUB_RUN_ID}"
          JWT_SECRET="$(openssl rand -base64 64)"

          # Talk to the app over a shared, run-unique network instead of a published
          # port: on a Docker-out-of-Docker self-hosted runner, published ports land
          # on the host netns, not this job's. Run-unique names also keep parallel
          # jobs on the same Docker host from colliding.
          docker network create "$NET"
          docker run -d --name "$APP" --network "$NET" \
            -e ENV=production \
            -e SCHIST_DATA_DIR=/app/data \
            -e SCHIST_PORT=8080 \
            -e SCHIST_JWT_SECRET="$JWT_SECRET" \
            "schist-test:${GITHUB_RUN_ID}"

          echo "Waiting for container to become healthy..."
          if docker run --rm --network "$NET" curlimages/curl:latest \
            sh -c 'for i in $(seq 1 30); do curl -fsS http://'"$APP"':8080/api/health && exit 0; sleep 2; done; exit 1'; then
            echo "Health check passed"
          else
            echo "Health check failed"
            docker logs "$APP" || true
            exit 1
          fi

      # Everything below publishes, so it runs only when this is NOT a pull request
      # (i.e. a push to main or a manual dispatch) -- and only because the steps
      # above succeeded, so :latest is always an image that passed the smoke test.
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # needs the job's packages: write

      - name: Tag and push the tested image
        if: github.event_name != 'pull_request'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # ghcr requires a lowercase image path.
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          TAGS=("$SHA_TAG")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS+=("${GITHUB_REF_NAME#v}")           # v0.0.1 -> 0.0.1; :latest stays on main
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS+=("latest")
          fi
          if [ -n "${INPUT_TAG}" ]; then
            TAGS+=("${INPUT_TAG}")
          fi

          # Push the exact image that was just smoke-tested -- no rebuild.
          for tag in "${TAGS[@]}"; do
            docker tag "schist-test:${GITHUB_RUN_ID}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          echo "Pushed: ${TAGS[*]}"

      - name: Cleanup Docker resources
        if: always()
        run: |
          # Only remove this job's resources -- never `docker system prune`, which
          # would wipe other jobs' containers and build cache on a shared Docker host.
          docker rm -f "app-${GITHUB_RUN_ID}" || true
          docker network rm "ci-${GITHUB_RUN_ID}" || true
          docker rmi "schist-test:${GITHUB_RUN_ID}" || true
