services:
  schist:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    ports:
      - "3000:8080"
    volumes:
      - ./e2e-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://schist:8080
      - ENV=production
      - SCHIST_WEBAUTHN_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://schist:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      ci-network:
        aliases:
          - schist

networks:
  ci-network:
    name: ci-network
    external: true