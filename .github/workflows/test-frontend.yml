# Frontend unit tests, lint, and type checking — runs only when frontend changes
name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Vitest browser mode (provider: playwright, chromium) needs a real headless
      # Chromium plus its system libraries. Rather than install them on the runner
      # -- the `playwright install --with-deps` apt pass hung the VPS 18+ min --
      # run the checks inside the official Playwright image, which has the browsers
      # AND deps baked in. So there's no install step at all, and no host coupling:
      # this behaves identically on the self-hosted VPS and on a GitHub-hosted runner.
      #
      # We deliberately do NOT use a `container:` job here. The self-hosted runner
      # is Docker-out-of-Docker, so its node externals don't mount into a job
      # container and checkout dies on `/__e/node24/bin/node: no such file`. Instead
      # we drive the image manually with docker create + cp + start, exactly like the
      # e2e job. Code is `docker cp`-ed in (not bind-mounted) because under DooD a
      # `-v` source resolves on the host, not in this job.
      #
      # The image tag's Playwright version MUST match frontend's `playwright` dep
      # (1.61), or playwright-core looks for a browser revision that isn't baked in
      # and tries to re-download. Bump both together.
      - name: Run frontend checks in the Playwright image
        run: |
          set -uo pipefail
          CID="$(docker create -w /frontend -e CI=true \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            sh -c 'npm ci && npm run test:unit && npm run lint && npm run check')"
          docker cp ./frontend/. "${CID}:/frontend"
          RC=0
          docker start -a "${CID}" || RC=$?
          docker rm -f "${CID}" >/dev/null 2>&1 || true
          exit $RC
