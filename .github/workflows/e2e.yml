# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      # Create test data directories
      - name: Prepare test environment  
        run: |
          mkdir -p test-data-auth-disabled test-data-auth-enabled
      
      # Start E2E services using simplified Docker setup
      - name: Start E2E services
        run: |
          echo "Starting E2E services with Docker Compose..."
          docker-compose -f docker-compose.e2e-ci.yml up --build -d
          
          # Wait for services to be healthy using Docker health checks
          echo "Waiting for services to become healthy..."
          timeout 60 bash -c 'while [ "$(docker-compose -f docker-compose.e2e-ci.yml ps -q | xargs -I {} docker inspect {} --format "{{.State.Health.Status}}" | grep -c healthy)" -lt 2 ]; do echo "Waiting for health checks..."; sleep 2; done' || {
            echo "❌ Health check timeout - showing container status:"
            docker-compose -f docker-compose.e2e-ci.yml ps
            docker-compose -f docker-compose.e2e-ci.yml logs
            exit 1
          }
          
          # Verify service connectivity using localhost (host networking mode)
          echo "Verifying service connectivity via localhost..."
          
          # Wait for auth-disabled service
          AUTH_DISABLED_READY=false
          AUTH_DISABLED_URL=""
          for i in {1..10}; do
            if curl -f -s --max-time 3 "http://localhost:8081/api/health" > /dev/null 2>&1; then
              echo "✅ Auth-disabled service ready via localhost:8081"
              AUTH_DISABLED_READY=true
              AUTH_DISABLED_URL="http://localhost:8081"
              break
            fi
            echo "Waiting for auth-disabled service... attempt $i/10"
            sleep 2
          done
          
          # Wait for auth-enabled service
          AUTH_ENABLED_READY=false
          AUTH_ENABLED_URL=""
          for i in {1..10}; do
            if curl -f -s --max-time 3 "http://localhost:8082/api/health" > /dev/null 2>&1; then
              echo "✅ Auth-enabled service ready via localhost:8082"
              AUTH_ENABLED_READY=true
              AUTH_ENABLED_URL="http://localhost:8082"
              break
            fi
            echo "Waiting for auth-enabled service... attempt $i/10"
            sleep 2
          done
          
          # Final verification
          echo "Final connectivity test..."
          if [ "$AUTH_DISABLED_READY" = "true" ] && [ "$AUTH_ENABLED_READY" = "true" ]; then
            echo "✅ Both services are ready!"
            
            # Use the working URLs discovered during connectivity tests
            echo "Using discovered working URLs for Playwright tests"
            echo "Auth-disabled URL: $AUTH_DISABLED_URL"
            echo "Auth-enabled URL: $AUTH_ENABLED_URL"
            
            echo "PLAYWRIGHT_AUTH_DISABLED_URL=$AUTH_DISABLED_URL" >> $GITHUB_ENV
            echo "PLAYWRIGHT_AUTH_ENABLED_URL=$AUTH_ENABLED_URL" >> $GITHUB_ENV
            echo "E2E_AUTH_DISABLED_URL=$AUTH_DISABLED_URL" >> $GITHUB_ENV
            echo "E2E_AUTH_ENABLED_URL=$AUTH_ENABLED_URL" >> $GITHUB_ENV
          else
            echo "❌ One or more services failed to become ready:"
            echo "  Auth-disabled ready: $AUTH_DISABLED_READY"
            echo "  Auth-enabled ready: $AUTH_ENABLED_READY"
            exit 1
          fi
          
          echo "✅ Services are ready!"
          docker-compose -f docker-compose.e2e-ci.yml ps
      
      # Run Playwright tests by project to ensure proper routing
      - name: Run Setup tests
        run: cd frontend && npx playwright test --project=setup
        env:
          CI: true
          # URLs are set dynamically by the service startup step
      
      - name: Run Auth-Disabled tests  
        run: cd frontend && npx playwright test --project=auth-disabled
        env:
          CI: true
          # URLs are set dynamically by the service startup step
      
      - name: Run Auth-Enabled Unauthenticated tests
        run: cd frontend && npx playwright test --project=auth-enabled-unauthenticated
        env:
          CI: true
          # URLs are set dynamically by the service startup step
      
      - name: Run Auth-Enabled tests
        run: cd frontend && npx playwright test --project=auth-enabled  
        env:
          CI: true
          # URLs are set dynamically by the service startup step
      
      # Show service logs if tests fail
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Auth-disabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-disabled
          echo "=== Auth-enabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-enabled
      
      # Ensure Docker containers are cleaned up even if tests fail
      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "Cleaning up E2E containers and images..."
          docker-compose -f docker-compose.e2e-ci.yml down --rmi all --volumes --remove-orphans 2>/dev/null || true
          
          # Clean up test data directories
          rm -rf test-data-auth-disabled test-data-auth-enabled || true
          
          echo "✅ Cleanup completed"
