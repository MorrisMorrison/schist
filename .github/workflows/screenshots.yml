name: README Screenshots

# Captures the README screenshots from a demo wiki (see e2e/readme-screenshots/).
# On main it force-pushes them to the dedicated `screenshots` branch, which the
# README links to, so main never gets bot commits. On PRs it only checks that the
# capture still works and uploads the images as an artifact for review.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'e2e/readme-screenshots/**'
      - 'e2e/playwright.screenshots.config.ts'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'e2e/readme-screenshots/**'
      - 'e2e/playwright.screenshots.config.ts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture + publish
    # GitHub-hosted on purpose: installs a browser on the host.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: go build -o ../.screenshots-bin/schist ./cmd/schist

      - name: Install e2e deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: e2e
        env:
          SCHIST_BIN: ../.screenshots-bin/schist
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Publish to the screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.png
          git commit -q -m "screenshots @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
