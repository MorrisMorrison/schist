version: '3.8'

services:
  schist:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./wiki-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - ENV=production
    restart: unless-stopped

