# Frontend unit tests, lint, and type checking — runs only when frontend changes
name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # The unit tests run in Vitest browser mode (provider: playwright, chromium),
    # so a real headless Chromium plus its system libraries must be present. Run
    # the whole job inside the official Playwright image -- browsers AND deps are
    # baked in -- so there's no `playwright install` step at all (the --with-deps
    # apt pass used to hang the VPS runner 18+ min). This is the same image e2e
    # runs in, and it removes the host coupling: the job works identically on the
    # self-hosted VPS and on a GitHub-hosted runner.
    #
    # The image tag's Playwright version MUST match frontend's `playwright` dep
    # (currently 1.61), otherwise playwright-core looks for a browser revision
    # that isn't baked in and tries to re-download. Bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests
        run: cd frontend && npm run test:unit

      - name: Run linting
        run: cd frontend && npm run lint

      - name: Run type checking
        run: cd frontend && npm run check
