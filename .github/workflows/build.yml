# GitHub Actions workflow for building the project
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build All
    runs-on: self-hosted
    env:
      PUBLIC_API_URL: http://localhost:8080/api
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Go for backend
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      
      # Set up Node.js for frontend  
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Build everything
      - name: Install dependencies and build
        run: make build
      

  docker-build:
    name: Docker Build
    runs-on: self-hosted
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build --build-arg PUBLIC_API_URL=/api -t schist:latest .
          
      - name: Test Docker image
        run: |
          docker run --rm -d --name schist-test -p 4001:8080 \
            -e ENV=production \
            -e SCHIST_DATA_DIR=/app/data \
            -e SCHIST_PORT=8080 \
            -e SCHIST_JWT_SECRET="aB3\$5fG8*9kL2&mN7@pQ4#rS6%tU1!vW0^xY5+zA8-bC3=dE7_fG2~hI4" \
            schist:latest
          
          # Wait for container to be ready with proper retry mechanism
          echo "Waiting for container to start..."
          for i in {1..30}; do
            if curl -f http://localhost:4001/api/health >/dev/null 2>&1; then
              echo "Health check passed after $i attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Health check failed after 30 attempts"
              docker logs schist-test
              docker stop schist-test
              exit 1
            fi
            sleep 1
          done
          
          # Final health check and cleanup
          if curl -f http://localhost:4001/api/health; then
            echo "Final health check passed"
            docker stop schist-test
          else
            echo "Final health check failed"
            docker logs schist-test
            docker stop schist-test
            exit 1
          fi
