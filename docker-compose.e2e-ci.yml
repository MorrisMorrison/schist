services:
  schist-e2e-auth-disabled:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    network_mode: "host"
    volumes:
      - ./test-data-auth-disabled:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8081
      - SCHIST_AUTH_ENABLED=false
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8081
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  schist-e2e-auth-enabled:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    network_mode: "host"
    volumes:
      - ./test-data-auth-enabled:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8082
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8082
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s