# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      # Create test data directory
      - name: Prepare test environment  
        run: |
          mkdir -p e2e-data
      
      # Start E2E service using runner's network namespace
      - name: Start E2E service  
        run: |
          echo "Starting E2E service using runner's network..."
          
          # Debug: Check all running containers
          echo "All running containers:"
          docker ps
          
          # Try different ways to find the runner container
          RUNNER_ID=$(docker ps --filter "name=gh-runner" --format "{{.ID}}")
          if [ -z "$RUNNER_ID" ]; then
            RUNNER_ID=$(docker ps --filter "label=com.docker.compose.service=runner" --format "{{.ID}}")
          fi
          if [ -z "$RUNNER_ID" ]; then
            RUNNER_ID=$(docker ps --filter "ancestor=myoung34/github-runner:latest" --format "{{.ID}}")
          fi
          
          echo "Runner container ID: '$RUNNER_ID'"
          
          if [ -z "$RUNNER_ID" ]; then
            echo "❌ Runner container not found! Falling back to host networking..."
            # Build the image first
            docker-compose -f docker-compose.e2e.yml build
            
            # Fallback: use host networking
            docker run -d \
              --name schist-e2e \
              --network host \
              -v "$(pwd)/e2e-data:/app/data" \
              -e SCHIST_DATA_DIR=/app/data \
              -e SCHIST_PORT=3000 \
              -e SCHIST_AUTH_ENABLED=true \
              -e SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long \
              -e SCHIST_FRONTEND_URL=http://localhost:3000 \
              -e ENV=production \
              schist_schist
          else
            echo "✅ Using runner container network: $RUNNER_ID"
            # Build the image first
            docker-compose -f docker-compose.e2e.yml build
            
            # Run using the runner's network namespace
            docker run -d \
              --name schist-e2e \
              --network container:$RUNNER_ID \
              -v "$(pwd)/e2e-data:/app/data" \
              -e SCHIST_DATA_DIR=/app/data \
              -e SCHIST_PORT=3000 \
              -e SCHIST_AUTH_ENABLED=true \
              -e SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long \
              -e SCHIST_FRONTEND_URL=http://localhost:3000 \
              -e ENV=production \
              schist_schist
          fi
          
          # Wait for service to be ready (now accessible via localhost:3000)
          echo "Waiting for service to be ready on localhost:3000..."
          for i in {1..30}; do
            if curl -f -s "http://localhost:3000/api/health" > /dev/null 2>&1; then
              echo "✅ Service ready at localhost:3000"
              break
            fi
            echo "Waiting for service... attempt $i/30"
            sleep 2
          done
      
      # Run Playwright tests (direct localhost access via shared network)
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      
      # Show service logs if tests fail
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== E2E service logs ==="
          docker logs schist-e2e || echo "No logs available"
      
      # Cleanup Docker containers
      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "Cleaning up E2E containers..."
          docker stop schist-e2e || true
          docker rm schist-e2e || true
          docker rmi schist_schist || true
          rm -rf e2e-data || true
          echo "✅ Cleanup completed"