# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      # Create test data directory
      - name: Prepare test environment  
        run: |
          mkdir -p e2e-data
      
      # Start E2E service in ci-network  
      - name: Start E2E service  
        run: |
          echo "Starting E2E service in ci-network..."
          docker-compose -f docker-compose.e2e.yml up --build -d
          
          # Wait for service to be healthy  
          echo "Waiting for service to become healthy..."
          timeout 60 bash -c 'while [ "$(docker-compose -f docker-compose.e2e.yml ps -q | xargs -I {} docker inspect {} --format "{{.State.Health.Status}}" | grep -c healthy)" -lt 1 ]; do echo "Waiting for health check..."; sleep 2; done'
          
          # Test connectivity within ci-network
          echo "Testing service connectivity within ci-network..."
          for i in {1..10}; do
            # Test using container name (both runner and service are on ci-network)
            if curl -f -s "http://schist:8080/api/health" > /dev/null 2>&1; then
              echo "✅ Service ready at schist:8080 within ci-network"
              # For WebAuthn compatibility, we'll need to proxy localhost to schist
              echo "PLAYWRIGHT_BASE_URL=http://schist:8080" >> $GITHUB_ENV
              break
            fi
            echo "Waiting for service... attempt $i/10"
            sleep 2
          done
      
      # Set up localhost proxy for WebAuthn compatibility
      - name: Set up localhost proxy
        run: |
          echo "Setting up localhost:3000 -> schist:8080 proxy for WebAuthn..."
          # Install socat for port forwarding
          sudo apt-get update && sudo apt-get install -y socat
          # Start background proxy from localhost:3000 to schist:8080
          nohup socat TCP-LISTEN:3000,fork,reuseaddr TCP:schist:8080 > /dev/null 2>&1 &
          echo "Proxy started, waiting for it to be ready..."
          sleep 2
          
          # Test the proxy
          for i in {1..5}; do
            if curl -f -s "http://localhost:3000/api/health" > /dev/null 2>&1; then
              echo "✅ Localhost proxy working - WebAuthn should work!"
              break
            fi
            echo "Waiting for proxy... attempt $i/5"
            sleep 2
          done

      # Run Playwright tests with localhost (WebAuthn compatible)
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      
      # Show service logs if tests fail
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== E2E service logs ==="
          docker-compose -f docker-compose.e2e.yml logs
      
      # Cleanup Docker containers
      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "Cleaning up E2E containers..."
          docker-compose -f docker-compose.e2e.yml down --rmi all --volumes --remove-orphans 2>/dev/null || true
          rm -rf e2e-data || true
          echo "✅ Cleanup completed"