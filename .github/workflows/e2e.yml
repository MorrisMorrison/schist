# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      - name: Prepare test environment  
        run: mkdir -p e2e-data
      
      - name: Start E2E service  
        run: |
          echo "Starting E2E service..."
          docker-compose -f docker-compose.e2e.yml up -d --build
          
          # Wait for service to be healthy
          echo "Waiting for service to become healthy..."
          timeout 60 bash -c 'while [ "$(docker-compose -f docker-compose.e2e.yml ps -q | xargs docker inspect --format "{{.State.Health.Status}}" | grep -c healthy)" -lt 1 ]; do echo "Waiting..."; sleep 2; done'
          
          # Verify connectivity
          echo "Verifying service is ready..."
          for i in {1..10}; do
            if curl -f -s "http://localhost:3000/api/health" > /dev/null; then
              echo "✅ Service ready at localhost:3000"
              break
            fi
            echo "Waiting... attempt $i/10"
            sleep 2
          done
      
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      
      - name: Show service logs on failure
        if: failure()
        run: docker-compose -f docker-compose.e2e.yml logs
      
      - name: Cleanup Docker containers
        if: always()
        run: |
          docker-compose -f docker-compose.e2e.yml down --rmi all --volumes --remove-orphans || true
          rm -rf e2e-data || true