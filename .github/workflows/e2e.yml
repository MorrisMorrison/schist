# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'

# Workflow-level: cancel a PR's in-flight run when a newer commit is pushed to
# the same ref, so the runner isn't wasted building stale commit states.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # Job-level: a single repo-wide lane so only ONE e2e job runs at a time
    # across all branches/PRs. The suite is resource-heavy (full Docker app
    # stack + Chromium); several on the shared self-hosted runner at once starve
    # each other's CPU and the SPA misses its visibility timeouts, surfacing as
    # spurious `toBeVisible` "element(s) not found" failures on otherwise-passing
    # tests (they cluster late in a run and on retries, as concurrent load
    # builds). cancel-in-progress is false here so queued runs from *other* PRs
    # are not dropped -- they take turns; same-PR supersession is still handled
    # by the workflow-level concurrency above. (GitHub concurrency caps a group
    # at 1; for N>1 parallel e2e the lever is fewer runner replicas or a
    # dedicated e2e runner, not re-grouping here.)
    concurrency:
      group: e2e-global-lane
      cancel-in-progress: false
    timeout-minutes: 10
    # docker-compose.yml's prod `schist` service declares SCHIST_JWT_SECRET as a
    # required variable (${SCHIST_JWT_SECRET:?...}). Compose interpolates every
    # service before applying --profile, so this must be set even though only the
    # e2e profile runs. A throwaway value is fine for tests.
    #
    # COMPOSE_PROJECT_NAME must be unique per run AND per attempt: a rerun keeps
    # the same run_id, so without run_attempt it reuses the previous attempt's
    # containers. A cancelled/failed attempt can leave a backend that already has
    # a registered user, making the rerun see `requires_setup: false` -- which
    # sends auth.setup down the existing-user path and fails (the virtual
    # authenticator is fresh and can't reproduce the prior run's passkey). Scoping
    # by attempt guarantees a clean backend every time.
    env:
      SCHIST_JWT_SECRET: test-jwt-secret-for-e2e-testing-32-bytes-long
      COMPOSE_PROJECT_NAME: schist-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7

      - name: Start E2E service
        run: |
          set -euo pipefail
          # Defensive: drop any leftovers from a previous attempt with this
          # project name (e.g. a cancelled run whose cleanup step didn't finish),
          # then build fresh so the backend starts with an empty datastore
          # (requires_setup: true) and auth.setup runs the first-time passkey flow.
          docker compose --profile e2e down -v --remove-orphans 2>/dev/null || true
          docker compose --profile e2e up -d --build --force-recreate

          echo "Waiting for service to become healthy..."
          timeout 120 bash -c '
            until [ "$(docker compose --profile e2e ps -q schist-e2e | xargs -r docker inspect --format "{{.State.Health.Status}}" 2>/dev/null)" = "healthy" ]; do
              echo "Waiting..."; sleep 2;
            done'

      - name: Run Playwright tests
        run: |
          set -uo pipefail
          # The runner is Docker-out-of-Docker, so published ports aren't reachable
          # from this job and WebAuthn needs a localhost/https secure context. Run
          # Playwright in a container that SHARES the app container's network
          # namespace, so the browser reaches the app on http://localhost:8080 -- a
          # valid WebAuthn origin matching the server's SCHIST_FRONTEND_URL.
          #
          # Code is streamed in with `docker cp` rather than a bind mount: under
          # DooD, `-v` source paths resolve on the host, not in this job, so a mount
          # would hand the sibling container an empty dir.
          APP="$(docker compose --profile e2e ps -q schist-e2e)"
          CID="$(docker create \
            --network "container:${APP}" \
            --ipc=host \
            -w /e2e \
            -e CI=true \
            -e PLAYWRIGHT_BASE_URL=http://localhost:8080 \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            sh -c 'npm ci && npx playwright test')"
          docker cp ./e2e/. "${CID}:/e2e"
          RC=0
          docker start -a "${CID}" || RC=$?
          # Pull reports/traces back out for the artifact upload step.
          docker cp "${CID}:/e2e/playwright-report" ./e2e/ 2>/dev/null || true
          docker cp "${CID}:/e2e/test-results" ./e2e/ 2>/dev/null || true
          docker rm -f "${CID}" >/dev/null 2>&1 || true
          exit $RC

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile e2e logs schist-e2e

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Docker containers
        if: always()
        run: docker compose --profile e2e down --rmi all --volumes --remove-orphans || true