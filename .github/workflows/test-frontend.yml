# Frontend unit tests, lint, and type checking — runs only when frontend changes
name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Vitest browser mode (provider: playwright, chromium) needs a real headless
      # Chromium plus its system libraries. Rather than install them on the runner
      # (a `playwright install --with-deps` apt pass can hang for many minutes on a
      # shared runner), run the checks inside the official Playwright image, which
      # has the browsers AND deps baked in. So there's no install step at all, and
      # no host coupling: this behaves the same on self-hosted and GitHub-hosted runners.
      #
      # We deliberately do NOT use a `container:` job here. On a Docker-out-of-Docker
      # self-hosted runner the node externals don't mount into a job
      # container and checkout dies on `/__e/node24/bin/node: no such file`. Instead
      # we drive the image manually with docker create + cp + start, exactly like the
      # e2e job. Code is `docker cp`-ed in (not bind-mounted) because under DooD a
      # `-v` source resolves on the host, not in this job.
      #
      # The image tag's Playwright version MUST match frontend's `playwright` dep
      # (1.61), or playwright-core looks for a browser revision that isn't baked in
      # and tries to re-download. Bump both together.
      - name: Run frontend checks in the Playwright image
        run: |
          set -uo pipefail
          CID="$(docker create -w /frontend -e CI=true \
            mcr.microsoft.com/playwright:v1.61.0-noble \
            sh -c 'npm ci && npm run test:unit -- --coverage --coverage.reporter=lcovonly --coverage.reporter=text-summary && npm run lint && npm run check')"
          docker cp ./frontend/. "${CID}:/frontend"
          RC=0
          docker start -a "${CID}" || RC=$?
          # Copy the lcov report out before removing the container (Codecov uploads it below).
          docker cp "${CID}:/frontend/coverage" ./frontend/ 2>/dev/null || true
          docker rm -f "${CID}" >/dev/null 2>&1 || true
          exit $RC

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
