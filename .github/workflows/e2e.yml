# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    # docker-compose.yml's prod `schist` service declares SCHIST_JWT_SECRET as a
    # required variable (${SCHIST_JWT_SECRET:?...}). Compose interpolates every
    # service before applying --profile, so this must be set even though only the
    # e2e profile runs. A throwaway value is fine for tests.
    env:
      SCHIST_JWT_SECRET: test-jwt-secret-for-e2e-testing-32-bytes-long

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js for E2E
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      
      - name: Install E2E dependencies
        run: cd e2e && npm ci
      
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium
      
      
      - name: Start E2E service  
        run: |
          echo "Starting E2E service..."
          docker compose --profile e2e up -d --build
          
          # Wait for service to be healthy
          echo "Waiting for service to become healthy..."
          timeout 60 bash -c 'while [ "$(docker compose ps -q schist-e2e | xargs docker inspect --format "{{.State.Health.Status}}" | grep -c healthy)" -lt 1 ]; do echo "Waiting..."; sleep 2; done'
          
          # Verify connectivity
          echo "Verifying service is ready..."
          for i in {1..10}; do
            if curl -f -s "http://localhost:3000/api/health" > /dev/null; then
              echo "✅ Service ready at localhost:3000"
              break
            fi
            echo "Waiting... attempt $i/10"
            sleep 2
          done
      
      - name: Run Playwright tests
        run: cd e2e && npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs schist-e2e

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Docker containers
        if: always()
        run: docker compose --profile e2e down --rmi all --volumes --remove-orphans || true