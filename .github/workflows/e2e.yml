# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      # Create test data directories
      - name: Prepare test data directories
        run: |
          mkdir -p test-data-auth-disabled test-data-auth-enabled
      
      # Start E2E services using CI docker-compose
      - name: Start E2E services
        run: |
          echo "Starting E2E services with local Docker build..."
          docker-compose -f docker-compose.e2e-ci.yml up --build -d
          
          # Wait a moment for containers to be fully started
          sleep 5
          
          # Get container IPs and update frontend URLs for WebAuthn
          echo "Updating WebAuthn configuration with container IPs..."
          DISABLED_ID=$(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled)
          ENABLED_ID=$(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled)
          
          echo "Container IDs: disabled=$DISABLED_ID, enabled=$ENABLED_ID"
          
          if [ -n "$DISABLED_ID" ] && [ -n "$ENABLED_ID" ]; then
            DISABLED_IP=$(docker inspect $DISABLED_ID --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
            ENABLED_IP=$(docker inspect $ENABLED_ID --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
            
            echo "Container IPs: disabled=$DISABLED_IP, enabled=$ENABLED_IP"
            
            if [ -n "$DISABLED_IP" ] && [ -n "$ENABLED_IP" ]; then
              echo "Restarting containers with correct frontend URLs..."
              echo "Auth-disabled will use: http://$DISABLED_IP:8080"
              echo "Auth-enabled will use: http://$ENABLED_IP:8080"
              
              # Stop containers
              docker-compose -f docker-compose.e2e-ci.yml stop
              
              # Set environment variables for the restart
              export E2E_DISABLED_FRONTEND_URL="http://$DISABLED_IP:8080"
              export E2E_ENABLED_FRONTEND_URL="http://$ENABLED_IP:8080"
              
              # Start containers with new URLs
              docker-compose -f docker-compose.e2e-ci.yml up -d
              
              # Wait for containers to start again
              sleep 10
            else
              echo "Warning: Could not get container IPs, using default URLs"
              echo "Disabled IP: '$DISABLED_IP', Enabled IP: '$ENABLED_IP'"
            fi
          else
            echo "Warning: Could not get container IDs"
          fi
          
          echo "=== Network debugging ==="
          echo "Checking ci-network exists:"
          docker network ls | grep ci-network || echo "❌ ci-network not found"
          
          echo "Container network connections:"
          docker-compose -f docker-compose.e2e-ci.yml ps -q | xargs -I {} docker inspect {} --format '{{.Name}}: {{range $net, $conf := .NetworkSettings.Networks}}{{$net}} {{end}}'
          
          echo "Waiting for services to be accessible..."
          echo "Giving containers initial startup time..."
          sleep 15
          # Wait for both services to be ready via their container IPs - up to 90 seconds
          for i in {1..30}; do
            auth_disabled_ready=false
            auth_enabled_ready=false
            
            # Get current container IPs
            DISABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
            ENABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
            
            if [ -n "$DISABLED_IP" ] && curl -f -s "http://$DISABLED_IP:8080/api/health" > /dev/null 2>&1; then
              auth_disabled_ready=true
            fi
            
            if [ -n "$ENABLED_IP" ] && curl -f -s "http://$ENABLED_IP:8080/api/health" > /dev/null 2>&1; then
              auth_enabled_ready=true
            fi
            
            if [ "$auth_disabled_ready" = true ] && [ "$auth_enabled_ready" = true ]; then
              echo "✅ Both services are ready!"
              break
            fi
            
            echo "Attempt $i/30: Waiting for services (disabled: $auth_disabled_ready, enabled: $auth_enabled_ready)..."
            
            # Additional debugging on failed attempts
            if [ $i -eq 10 ]; then
              echo "=== Debugging after 10 attempts ==="
              echo "Port bindings:"
              docker port $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) 2>/dev/null || echo "No port info for auth-disabled"
              docker port $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) 2>/dev/null || echo "No port info for auth-enabled"
              echo "Container IPs:"
              docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' 2>/dev/null || echo "No IP for auth-disabled"
              docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' 2>/dev/null || echo "No IP for auth-enabled"
              echo "Container status details:"
              docker-compose -f docker-compose.e2e-ci.yml ps
              echo "Container logs (auth-disabled):"
              docker-compose -f docker-compose.e2e-ci.yml logs --tail=20 schist-e2e-auth-disabled
              echo "Container logs (auth-enabled):"
              docker-compose -f docker-compose.e2e-ci.yml logs --tail=20 schist-e2e-auth-enabled
              echo "Testing direct container IP connectivity:"
              DISABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
              ENABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
              if [ -n "$DISABLED_IP" ]; then
                echo "Testing auth-disabled at $DISABLED_IP:8080"
                curl -f -s "http://$DISABLED_IP:8080/api/health" && echo "✅ Direct IP works for auth-disabled" || echo "❌ Direct IP failed for auth-disabled"
              fi
              if [ -n "$ENABLED_IP" ]; then
                echo "Testing auth-enabled at $ENABLED_IP:8080"
                curl -f -s "http://$ENABLED_IP:8080/api/health" && echo "✅ Direct IP works for auth-enabled" || echo "❌ Direct IP failed for auth-enabled"
              fi
              echo "Testing health endpoint from inside containers:"
              docker exec $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) curl -f -s "http://127.0.0.1:8080/api/health" && echo "✅ Health endpoint works inside auth-disabled container" || echo "❌ Health endpoint failed inside auth-disabled container"
              docker exec $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) curl -f -s "http://127.0.0.1:8080/api/health" && echo "✅ Health endpoint works inside auth-enabled container" || echo "❌ Health endpoint failed inside auth-enabled container"
              echo "Testing network connectivity from runner to containers:"
              ping -c 2 $DISABLED_IP && echo "✅ Runner can ping auth-disabled container" || echo "❌ Runner cannot ping auth-disabled container"
              ping -c 2 $ENABLED_IP && echo "✅ Runner can ping auth-enabled container" || echo "❌ Runner cannot ping auth-enabled container"
            fi
            
            sleep 3
          done
          
          # Final verification using container IPs (which we know work)
          echo "Final connectivity verification:"
          DISABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
          ENABLED_IP=$(docker inspect $(docker-compose -f docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "")
          curl -f -s "http://$DISABLED_IP:8080/api/health" > /dev/null && echo "✅ Auth-disabled service: OK ($DISABLED_IP:8080)" || echo "❌ Auth-disabled service: FAILED"
          curl -f -s "http://$ENABLED_IP:8080/api/health" > /dev/null && echo "✅ Auth-enabled service: OK ($ENABLED_IP:8080)" || echo "❌ Auth-enabled service: FAILED"
          
          # Check WebAuthn configuration by looking at container logs
          echo "Checking WebAuthn configuration in container logs:"
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-enabled | grep -i "webauthn configuration" || echo "No WebAuthn config logs found"
          
          echo "Container status:"
          docker-compose -f docker-compose.e2e-ci.yml ps
      
      # Run Playwright tests
      - name: Run Playwright tests
        run: |
          cd frontend
          # Get container IPs for Playwright
          DISABLED_IP=$(docker inspect $(docker-compose -f ../docker-compose.e2e-ci.yml ps -q schist-e2e-auth-disabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "localhost")
          ENABLED_IP=$(docker inspect $(docker-compose -f ../docker-compose.e2e-ci.yml ps -q schist-e2e-auth-enabled) --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || echo "localhost")
          
          echo "Setting Playwright URLs:"
          echo "E2E_AUTH_DISABLED_URL=http://$DISABLED_IP:8080"
          echo "E2E_AUTH_ENABLED_URL=http://$ENABLED_IP:8080"
          
          export E2E_AUTH_DISABLED_URL="http://$DISABLED_IP:8080"
          export E2E_AUTH_ENABLED_URL="http://$ENABLED_IP:8080"
          
          npx playwright test
        env:
          CI: true
      
      # Show service logs if tests fail
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Auth-disabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-disabled
          echo "=== Auth-enabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-enabled
      
      # Ensure Docker containers are cleaned up even if tests fail
      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "Cleaning up E2E containers and images..."
          docker-compose -f docker-compose.e2e-ci.yml down --rmi all --volumes --remove-orphans 2>/dev/null || true
          
          # Additional cleanup for any stray containers
          docker stop $(docker ps -q --filter "name=schist") 2>/dev/null || true
          docker rm $(docker ps -aq --filter "name=schist") 2>/dev/null || true
          
          # Clean up test data directories
          rm -rf test-data-auth-disabled test-data-auth-enabled || true
          
          echo "✅ Cleanup completed"
