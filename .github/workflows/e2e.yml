# GitHub Actions workflow for running Playwright E2E tests
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      # Set up Node.js (22.12.0 required for Svelte)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      # Install Playwright browsers
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      
      # Create test data directories
      - name: Prepare test data directories
        run: |
          mkdir -p test-data-auth-disabled test-data-auth-enabled
      
      # Start E2E services using CI docker-compose
      - name: Start E2E services
        run: |
          echo "Starting E2E services with local Docker build..."
          docker-compose -f docker-compose.e2e-ci.yml up --build -d
          
          echo "Waiting for services to be healthy..."
          # Wait for containers to be healthy
          timeout 120 bash -c '
            while ! docker-compose -f docker-compose.e2e-ci.yml ps --filter "health=healthy" | grep schist-e2e-auth-disabled > /dev/null; do
              echo "Waiting for auth-disabled service to be healthy..."
              sleep 3
            done
          '
          
          timeout 120 bash -c '
            while ! docker-compose -f docker-compose.e2e-ci.yml ps --filter "health=healthy" | grep schist-e2e-auth-enabled > /dev/null; do
              echo "Waiting for auth-enabled service to be healthy..."
              sleep 3
            done
          '
          
          echo "✅ Services are healthy!"
          
          # Additional connectivity check from host
          echo "Testing connectivity from host..."
          timeout 60 bash -c '
            while ! curl -f -s http://localhost:8081/api/health > /dev/null; do
              echo "Waiting for auth-disabled service to be reachable on localhost:8081..."
              sleep 2
            done
          '
          
          timeout 60 bash -c '
            while ! curl -f -s http://localhost:8082/api/health > /dev/null; do
              echo "Waiting for auth-enabled service to be reachable on localhost:8082..."
              sleep 2
            done
          '
          
          echo "✅ All services are ready and accessible!"
          docker-compose -f docker-compose.e2e-ci.yml ps
      
      # Run Playwright tests
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          CI: true
      
      # Show service logs if tests fail
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Auth-disabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-disabled
          echo "=== Auth-enabled service logs ==="
          docker-compose -f docker-compose.e2e-ci.yml logs schist-e2e-auth-enabled
      
      # Ensure Docker containers are cleaned up even if tests fail
      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "Cleaning up E2E containers and images..."
          docker-compose -f docker-compose.e2e-ci.yml down --rmi all --volumes --remove-orphans 2>/dev/null || true
          
          # Additional cleanup for any stray containers
          docker stop $(docker ps -q --filter "name=schist") 2>/dev/null || true
          docker rm $(docker ps -aq --filter "name=schist") 2>/dev/null || true
          
          # Clean up test data directories
          rm -rf test-data-auth-disabled test-data-auth-enabled || true
          
          echo "✅ Cleanup completed"
