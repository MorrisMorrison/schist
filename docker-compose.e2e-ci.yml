networks:
  e2e-network:
    driver: bridge

services:
  schist-e2e-auth-disabled:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    ports:
      - "8081:8080"
    volumes:
      - ./test-data-auth-disabled:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=false
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8081
      - ENV=production
    networks:
      - e2e-network
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  schist-e2e-auth-enabled:
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    ports:
      - "8082:8080"
    volumes:
      - ./test-data-auth-enabled:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=test-jwt-secret-for-e2e-testing-32-bytes-long
      - SCHIST_FRONTEND_URL=http://localhost:8082
      - ENV=production
    networks:
      - e2e-network
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s