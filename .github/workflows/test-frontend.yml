# Frontend unit tests, lint, and type checking — runs only when frontend changes
name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests
    # The unit tests run in Vitest browser mode (real headless Chromium), so the
    # browser binary must exist on the runner. We install only the binary (see the
    # install step) -- the system libs are provisioned once on the self-hosted host.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # Without the apt pass the whole job is a few minutes; cap it low so a stuck
    # step fails fast instead of burning the runner for 20 min.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Unit tests run in Vitest browser mode (provider: playwright, chromium),
      # so the browser binary must be present on the runner.
      #
      # Install ONLY the browser binary -- not --with-deps. That flag shells out
      # to apt-get, which stalls indefinitely on the self-hosted VPS (no
      # interactive sudo, and dpkg-lock contention when both runner instances hit
      # it at once) -- a job was observed hung 18+ min on exactly this step. The
      # chromium system libraries are provisioned once on the VPS host, so the
      # apt pass is pure liability here. (If RUNS_ON is ever pointed back at a
      # GitHub-hosted runner, re-add --with-deps or run these in the prebaked
      # Playwright container the way e2e does.)
      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium

      - name: Run frontend unit tests
        run: cd frontend && npm run test:unit

      - name: Run linting
        run: cd frontend && npm run lint

      - name: Run type checking
        run: cd frontend && npm run check
