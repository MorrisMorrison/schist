services:
  schist:
    profiles: ["prod"]
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    ports:
      - "8080:8080"
    volumes:
      - ./wiki-data:/app/data
    environment:
      - SCHIST_DATA_DIR=/app/data
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=${SCHIST_JWT_SECRET:?Set SCHIST_JWT_SECRET (min 32 characters)}
      - SCHIST_FRONTEND_URL=http://localhost:8080
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  schist-e2e:
    profiles: ["e2e"]
    build:
      context: .
      args:
        PUBLIC_API_URL: ""
    # No host port publish: the e2e job's Docker-out-of-Docker runner can't reach
    # published ports (they land on the host netns). Playwright instead runs in a
    # container that shares this service's network namespace and hits it on
    # localhost:8080 -- which also keeps WebAuthn happy (it requires a localhost or
    # https secure context). FRONTEND_URL therefore must be localhost:8080 so the
    # server's WebAuthn RP origin matches the browser origin.
    environment:
      - SCHIST_PORT=8080
      - SCHIST_AUTH_ENABLED=true
      - SCHIST_JWT_SECRET=${SCHIST_JWT_SECRET:-test-jwt-secret-for-e2e-testing-32-bytes-long}
      - SCHIST_FRONTEND_URL=http://localhost:8080
      - ENV=production
      # Rate limiting is now secure-by-default ON (SCHIST_RATE_LIMIT_ENABLED).
      # The e2e fixtures seed test data with rapid API bursts, which trips the
      # limiter (429s) and fails the infra/lifecycle tests. Disable it for the
      # test harness only -- prod keeps the secure default.
      - SCHIST_RATE_LIMIT_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

