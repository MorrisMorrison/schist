# Frontend unit tests, lint, and type checking — runs only when frontend changes
name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests
    # NOT a cheap job: the unit tests run in Vitest browser mode (real headless
    # Chromium). On a fresh GitHub-hosted runner `playwright install --with-deps`
    # hangs on apt; the self-hosted box already has the browser + deps. Keep this
    # on the self-hosted runner alongside e2e.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Unit tests run in Vitest browser mode (provider: playwright, chromium),
      # so the browser binary must be present on the runner.
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run frontend unit tests
        run: cd frontend && npm run test:unit

      - name: Run linting
        run: cd frontend && npm run lint

      - name: Run type checking
        run: cd frontend && npm run check
