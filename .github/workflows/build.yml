# GitHub Actions workflow for building the project
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build All
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    env:
      PUBLIC_API_URL: http://localhost:8080/api
    
    steps:
      - uses: actions/checkout@v6
      
      # Set up Go for backend
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      
      # Set up Node.js for frontend  
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Build everything
      - name: Install dependencies and build
        run: make build
      

  docker-build:
    name: Docker Build
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    needs: build
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Build Docker image
        run: |
          docker build -t schist-test:latest .
          
      - name: Test Docker image
        run: |
          JWT_SECRET="$(openssl rand -base64 64)"
          docker run --rm -d --name schist-test -p 4001:8080 \
            -e ENV=production \
            -e SCHIST_DATA_DIR=/app/data \
            -e SCHIST_PORT=8080 \
            -e SCHIST_JWT_SECRET="$JWT_SECRET" \
            schist-test:latest
          
          # Wait for container to be ready with proper retry mechanism
          echo "Waiting for container to start..."
          for i in {1..30}; do
            if curl -f http://localhost:4001/api/health >/dev/null 2>&1; then
              echo "Health check passed after $i attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Health check failed after 30 attempts"
              docker logs schist-test
              docker stop schist-test
              exit 1
            fi
            sleep 1
          done
          
          # Final health check and cleanup
          if curl -f http://localhost:4001/api/health; then
            echo "Final health check passed"
          else
            echo "Final health check failed"
            docker logs schist-test
            exit 1
          fi
      
      - name: Cleanup Docker resources
        if: always()
        run: |
          # Stop and remove test container
          docker stop schist-test || true
          docker rm schist-test || true
          
          # Remove test image to free space
          docker rmi schist-test:latest || true
          
          # Clean up any orphaned containers/networks
          docker system prune -f || true
